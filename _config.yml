url: "https://www.gospeldesk.org"
sass:
  sass_dir: .
exclude:
  - "TODO"
  - "CNAME"
  - "Gemfile"
  - "Gemfile.lock"
  - "Makefile"
  - "README.md"
  - "bin"
  - "src"
  - "email.md"
  - "node_modules"
defaults:
  -
    scope:
      path: ""
    values:
      layout: "page"
      html_title_sep: "-"
      clip_bottom: false
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      clip_bottom: false
  -
    scope:
      path: ""
      type: "characters"
    values:
      layout: "character"
  -
    scope:
      path: ""
      type: "readings"
    values:
      layout: "reading"
collections:
  posts:
    permalink: "/:year/:title/"
  synaxis:
    permalink: "/synaxis/:slug/"
    output: true
  characters:
    permalink: "/characters/:slug/"
    output: true
  readings:
    permalink: "/readings/:slug/"
    output: true

plugins:
  - jekyll-feed

# For RSS feed, keep in sync with index.html meta
title: Gospel Desk
excerpt: "JCCU"
author: Chad Whitacre
