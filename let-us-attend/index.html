<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Let Us Attend! - Gospel Desk</title>
  <link rel="stylesheet" href="let-us-attend.css">
</head>
<body>
  <div class="hex-viewport" id="hex-viewport">
    <div class="hex-canvas" id="hex-canvas"></div>
  </div>

  <div class="stats-box">
    <span id="collected-count">0</span>/<span id="total-count">0</span>
    <span class="divider">·</span>
    <span id="next-tile">-</span>
  </div>

  <div class="modal-overlay" id="reading-modal">
    <div class="modal-content">
      <h2 id="modal-title"></h2>
      <p class="ref" id="modal-ref"></p>
      <div class="reading-text" id="modal-text"></div>
      <div class="modal-actions">
        <button class="btn-secondary" id="close-modal-btn">Close</button>
        <button class="btn-primary" id="mark-read-btn">Mark as Read</button>
      </div>
    </div>
  </div>

  <script src="let-us-attend.js"></script>
  <script>
    // Initialize game when DOM is ready
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof initGame === 'function') {
        initGame();
      }
    });
  </script>
</body>
</html>
