<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Let Us Attend! - Gospel Desk</title>
  <link rel="stylesheet" href="let-us-attend.css">
</head>
<body>
  <div class="hex-viewport" id="hex-viewport">
    <div class="hex-canvas" id="hex-canvas"></div>
  </div>

  <div class="stats-box">
    <div class="progress-bar">
      <div class="progress-placed" id="progress-placed"></div>
      <div class="progress-collected" id="progress-collected"></div>
    </div>
    <div class="timer-bar"><div class="timer-fill" id="timer-fill"></div></div>
  </div>

  <div class="modal-overlay" id="reading-modal">
    <div class="modal-content">
      <h2 id="modal-title"></h2>
      <p class="ref" id="modal-ref"></p>
      <div class="reading-text" id="modal-text"></div>
      <div class="completion-indicator" id="completion-indicator">
        <svg viewBox="0 0 3600 3600">
          <path class="outline" d="M 1109.775 591.2 L 2744.975 591.2 L 2744.975 2896.16 L 2489.039 3008.8 L 1620.175 3008.8 L 1620.175 3311.777 L 1364.175 3209.377 L 1108.175 3311.777 L 1108.175 3008.8 L 853.775 3008.8 L 853.775 702.641 Z"/>
          <path class="ribbon" d="M 1108.175 2804 L 1108.175 3311.777 L 1364.175 3209.377 L 1620.175 3311.777 L 1620.175 2804 Z"/>
          <path class="book" d="M 853.775 702.641 L 1109.775 591.2 L 2744.975 591.2 L 2744.975 2896.16 L 2489.039 3008.8 L 853.775 3008.8 Z"/>
        </svg>
      </div>
    </div>
  </div>

  <script src="let-us-attend.js"></script>
  <script>
    // Initialize game when DOM is ready
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof initGame === 'function') {
        initGame();
      }
    });
  </script>
</body>
</html>
